; zero-setup runtime tuning — otomatis dibaca PHP-FPM (DirectAdmin/LiteSpeed), tanpa sentuh panel
; upload 5MB di app => headroom 12M (default hosting 2M)
upload_max_filesize = 12M
; post body >= upload + field JSON => 14M
post_max_size = 14M
; QR/phpspreadsheet (import excel) butuh lebih dari default 128M
memory_limit = 256M
; export CSV + render sertifikat lama => perpanjang dari 30s default
max_execution_time = 120
max_input_time = 120
; diabaikan bila extension OPcache tidak ada; di PHP_INI_SYSTEM (php.ini/panel) hanya itu yang efektif — line ini aman walau tidak jalan
opcache.enable = 1

; ===== Security: tutup bocoran error ke publik (defense-in-depth) =====
display_errors = Off
log_errors = On
; E_ALL menghitung semua error termasuk notice/E_DEPRECATED; log semua agar
; celah/pelemahan cepat terdeteksi dari log (bukan dari output HTTP).
error_reporting = E_ALL