<style>
 /* Satoshi - single font system for Eskulify (Variable 300-900) */
 @font-face{
  font-family:'Satoshi';
  src: url('/fonts/satoshi/Satoshi-Variable.woff2') format('woff2-variations'),
     url('/fonts/satoshi/Satoshi-Variable.woff2') format('woff2');
  font-weight: 300 900;
  font-style: normal;
  font-display: swap;
 }
 @font-face{
  font-family:'Satoshi';
  src: url('/fonts/satoshi/Satoshi-VariableItalic.woff2') format('woff2-variations'),
     url('/fonts/satoshi/Satoshi-VariableItalic.woff2') format('woff2');
  font-weight: 300 900;
  font-style: italic;
  font-display: swap;
 }
 /* static fallbacks for older browsers */
 @font-face{ font-family:'Satoshi'; src: url('/fonts/satoshi/Satoshi-Regular.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
 @font-face{ font-family:'Satoshi'; src: url('/fonts/satoshi/Satoshi-Medium.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:swap; }
 @font-face{ font-family:'Satoshi'; src: url('/fonts/satoshi/Satoshi-Bold.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }
 @font-face{ font-family:'Satoshi'; src: url('/fonts/satoshi/Satoshi-Black.woff2') format('woff2'); font-weight:900; font-style:normal; font-display:swap; }
 html,body{ font-family:'Satoshi',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif }
 .logo-font{ font-family:'Satoshi',system-ui,sans-serif; font-weight:800; letter-spacing:-.02em }
 .mono{ font-family:'Satoshi',system-ui,sans-serif !important; letter-spacing:.02em }
